<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 350" role="img" aria-labelledby="title desc"><title id="title">Photo Booth: engineering approach</title><desc id="desc">Reproduce the symptom then Isolate the failure then Build a focused test then Document the evidence. Generic process illustration.</desc><rect width="1600" height="350" fill="#0a1128"/><g font-family="Arial, sans-serif"><text x="40" y="58" fill="#d4af37" font-size="22" letter-spacing="3">ENGINEERING APPROACH</text><rect x="40" y="104" width="350" height="180" rx="12" fill="#14213b" stroke="#766139"/><text x="68" y="148" fill="#d4af37" font-size="20">01</text><text x="68" y="192" fill="#faf5e9" font-size="25">Reproduce the symptom</text><path d="M398 194h24m-7-7 7 7-7 7" fill="none" stroke="#d4af37" stroke-width="2"/><rect x="430" y="104" width="350" height="180" rx="12" fill="#14213b" stroke="#766139"/><text x="458" y="148" fill="#d4af37" font-size="20">02</text><text x="458" y="192" fill="#faf5e9" font-size="25">Isolate the failure</text><path d="M788 194h24m-7-7 7 7-7 7" fill="none" stroke="#d4af37" stroke-width="2"/><rect x="820" y="104" width="350" height="180" rx="12" fill="#14213b" stroke="#766139"/><text x="848" y="148" fill="#d4af37" font-size="20">03</text><text x="848" y="192" fill="#faf5e9" font-size="25">Build a focused test</text><path d="M1178 194h24m-7-7 7 7-7 7" fill="none" stroke="#d4af37" stroke-width="2"/><rect x="1210" y="104" width="350" height="180" rx="12" fill="#14213b" stroke="#766139"/><text x="1238" y="148" fill="#d4af37" font-size="20">04</text><text x="1238" y="192" fill="#faf5e9" font-size="25">Document the evidence</text><text x="40" y="324" fill="#bac1cf" font-size="18">Illustrative process only · No proprietary system architecture</text></g></svg>
